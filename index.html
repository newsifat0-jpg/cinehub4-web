<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101426">
  <title>Prime Scene</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="backBtn">‹</button>
      <div class="brand">
        <div class="brand-mark">P</div>
        <div class="brand-text">PRIME <span>SCENE</span></div>
      </div>
      <button class="icon-btn" id="menuBtn">⋮</button>
    </header>

    <main id="screen"></main>

    <nav class="bottom-nav">
      <button data-page="home" class="nav-item active"><b>▦</b><span>Home</span></button>
      <button data-page="series" class="nav-item"><b>▤</b><span>Series</span></button>
      <button data-page="adult" class="nav-item"><b>18+</b><span>Adult</span></button>
      <button data-page="profile" class="nav-item"><b>♙</b><span>Profile</span></button>
    </nav>

    <div id="drawer" class="drawer-wrap hidden">
      <div class="drawer-backdrop"></div>
      <aside class="drawer">
        <div class="drawer-head"><strong>Menu</strong><button id="closeDrawer">×</button></div>
        <button data-page="movies">▣ <span>Movies</span></button>
        <button data-page="series">▤ <span>Series</span></button>
        <button data-page="adult">🔞 <span>Adult</span></button>
        <button data-page="profile" class="selected">♙ <span>User</span></button>
        <button data-page="points">🪙 <span>Buy Points</span></button>
        <div class="drawer-spacer"></div>
        <button data-page="settings">⚙ <span>Settings</span></button>
        <button data-page="telegram">◉ <span>Telegram</span></button>
      </aside>
    </div>

    <div id="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
    </html>
