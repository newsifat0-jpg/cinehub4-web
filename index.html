<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Cine Hub4</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#07101d;--panel:#101a2b;--panel2:#151f33;--text:#f5f7ff;--muted:#9aa7bd;
  --line:#25314a;--a:#7b5cff;--b:#16c8e8;--ok:#25d366;--warn:#ffbd3e;--danger:#ff4d67;
  --radius:18px;--shadow:0 12px 35px rgba(0,0,0,.28)
}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08111f,#050a13 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{border:0;color:#fff;cursor:pointer}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:20;background:rgba(7,16,29,.9);backdrop-filter:blur(14px);padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.toprow{display:flex;align-items:center;gap:10px}.brand{font-weight:900;font-size:17px;flex:1}.pill{background:#252d3e;padding:4px 8px;border-radius:8px;font-size:11px}.pill b{background:#19bfe2;padding:3px 6px;border-radius:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:#172236}.screen{padding:12px}.hidden{display:none!important}
.hero-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero-tab{padding:14px;border-radius:15px;background:#16233a;text-align:left}.hero-tab.active{background:linear-gradient(135deg,#7354ff,#18c8e5);box-shadow:0 8px 25px rgba(83,100,255,.25)}.hero-tab small{display:block;font-size:9px;opacity:.8}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}.chip{white-space:nowrap;background:#182238;border:1px solid #27344d;border-radius:20px;padding:8px 13px;font-size:11px}.chip.active{background:linear-gradient(90deg,#8b5cf6,#12cce8);border:0}
.card{background:linear-gradient(145deg,#142238,#0e1829);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:15px;margin:10px 0;box-shadow:var(--shadow)}
.eyebrow{font-size:10px;color:#b9c4d8;text-transform:uppercase;letter-spacing:.12em}.title{font-size:18px;font-weight:900;margin:5px 0}.muted{color:var(--muted);font-size:12px;line-height:1.5}
.cta{display:flex;gap:8px;margin-top:12px}.btn{padding:11px 14px;border-radius:12px;background:#1a2840}.btn.primary{background:linear-gradient(90deg,#7655ff,#10c8e8);font-weight:800}.btn.ok{background:#168e55}.btn.danger{background:#b92f49}.btn.warn{background:#9a6b00}.btn.full{width:100%}
.movie-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.movie{overflow:hidden;background:#111c2e;border-radius:15px;border:1px solid #24314a}.poster{aspect-ratio:2/3;background:#1a2538;object-fit:cover;width:100%;display:block}.movie-body{padding:9px}.movie-title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movie-meta{font-size:10px;color:var(--muted);margin-top:4px}.rating{color:#ffd45a}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:rgba(8,15,27,.96);border-top:1px solid #202c42;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav{background:transparent;color:#93a0b7;padding:6px 2px;font-size:10px}.nav.active{color:#fff}.nav span{display:block;font-size:19px;margin-bottom:2px}
.detail-backdrop{height:220px;border-radius:18px;object-fit:cover;width:100%;filter:brightness(.65)}.detail-poster{width:110px;border-radius:14px;margin-top:-55px;margin-left:16px;position:relative;border:3px solid #0d1727}.badge{display:inline-block;font-size:10px;background:#20304a;border-radius:9px;padding:5px 8px;margin:3px 3px 3px 0}.server{display:flex;gap:8px}.server .btn{flex:1}.search{display:flex;gap:8px}.search input,.form input,.form textarea,.form select{width:100%;background:#0b1525;border:1px solid #28364e;color:#fff;border-radius:12px;padding:12px;outline:none}.form{display:grid;gap:10px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}.section-head h3{margin:0;font-size:15px}.empty{text-align:center;color:var(--muted);padding:35px 10px}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}.drawer{width:82%;max-width:360px;height:100%;background:#0d1728;padding:18px;box-shadow:var(--shadow)}.drawer .btn{width:100%;text-align:left;margin:6px 0}
.admin{max-width:900px;margin:auto;padding:14px}.admin .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;border-radius:16px;background:#121f34;border:1px solid #25334d}.stat b{display:block;font-size:25px;margin-top:5px}.table{overflow:auto}.row{display:grid;grid-template-columns:1.4fr .7fr .8fr .8fr;gap:8px;padding:10px;border-bottom:1px solid #25314a;font-size:11px;align-items:center}.row.head{font-weight:900;color:#aebbd0}.admin-nav{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.admin-nav .btn{white-space:nowrap}.switch{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #25314a}.switch input{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172238;border:1px solid #33425e;padding:10px 14px;border-radius:12px;z-index:100;box-shadow:var(--shadow);font-size:12px}
@media(min-width:700px){.app{max-width:1100px}.bottom{max-width:1100px}.movie-grid{grid-template-columns:repeat(5,1fr)}.admin .grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   CENTRAL CONFIG — ONLY CHANGE API/IDs HERE
   Data collections used:
   config/main
   movies
   users
   requests
   ========================================================= */
const CONFIG={
  botName:"Cine Hub4",
  botUsername:"Cinehub4bot",
  ownerId:"5605543865",
  adminIds:["7830499211","1904834862"],
  firebaseProjectId:"cinehub4-d1773",
  firestoreApiKey:"AIzaSyBdoLUyIh83s7w72eOU_cEdF5aAcqfDdQ",
  tmdbApiKey:"2f84235873a478ed4c3601374da7f4",
  tmdbLang:"en-US",
  forceJoin:true,
  channelUsername:"chinehub4",
  server1Enabled:true,server2Enabled:true,server3Enabled:true,
  maintenanceMode:false
};

const TG=window.Telegram?.WebApp;
TG?.ready(); TG?.expand();

const state={
  lang:localStorage.getItem("lang")||"bn",
  page:"home",movies:[],selected:null,search:"",
  favourites:JSON.parse(localStorage.getItem("favourites")||"[]"),
  viewed:JSON.parse(localStorage.getItem("viewed")||"[]"),
  adminTab:"dashboard",requests:[],users:[],cfg:{}
};

const T={
 bn:{home:"হোম",movies:"মুভি",search:"সার্চ",fav:"ফেভারিট",profile:"প্রোফাইল",request:"মুভি রিকোয়েস্ট",recent:"সম্প্রতি যোগ",trend:"ট্রেন্ডিং",viewed:"সাম্প্রতিক দেখা",admin:"এডমিন প্যানেল",details:"মুভি ডিটেইলস",send:"রিকোয়েস্ট পাঠান",save:"সেভ",back:"ফিরে যান",loading:"লোড হচ্ছে...",no:"কিছু পাওয়া যায়নি"},
 en:{home:"Home",movies:"Movies",search:"Search",fav:"Favourite",profile:"Profile",request:"Movie Request",recent:"Recently Added",trend:"Trending",viewed:"Recently Viewed",admin:"Admin Panel",details:"Movie Details",send:"Send Request",save:"Save",back:"Back",loading:"Loading...",no:"Nothing found"},
 hi:{home:"होम",movies:"मूवी",search:"सर्च",fav:"फेवरेट",profile:"प्रोफाइल",request:"मूवी रिक्वेस्ट",recent:"हाल में जोड़े गए",trend:"ट्रेंडिंग",viewed:"हाल ही में देखे",admin:"एडमिन पैनल",details:"मूवी डिटेल्स",send:"रिक्वेस्ट भेजें",save:"सेव",back:"वापस",loading:"लोड हो रहा है...",no:"कुछ नहीं मिला"}
};
const t=k=>T[state.lang]?.[k]||T.en[k]||k;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2300);}
function isAdmin(){let id=String(TG?.initDataUnsafe?.user?.id||"");return id===String(CONFIG.ownerId)||CONFIG.adminIds.includes(id);}
function uid(){return String(TG?.initDataUnsafe?.user?.id||"0");}
function userName(){return TG?.initDataUnsafe?.user?.first_name||"Guest";}

/* ---------- Firestore REST ---------- */
function fsBase(){return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(CONFIG.firebaseProjectId)}/databases/(default)/documents`;}
async function fsGet(path){let r=await fetch(`${fsBase()}/${path}?key=${encodeURIComponent(CONFIG.firestoreApiKey)}`);if(!r.ok)throw new Error("Firestore GET "+r.status);return r.json();}
async function fsList(collection){let r=await fetch(`${fsBase()}/${collection}?pageSize=1000&key=${encodeURIComponent(CONFIG.firestoreApiKey)}`);if(!r.ok)throw new Error("Firestore LIST "+r.status);return r.json();}
function fsFields(o){let f={};for(const[k,v]of Object.entries(o)){if(v===null)f[k]={nullValue:null};else if(typeof v==="boolean")f[k]={booleanValue:v};else if(typeof v==="number")f[k]=Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};else if(Array.isArray(v))f[k]={arrayValue:{values:v.map(x=>typeof x==="number"?{integerValue:String(x)}:{stringValue:String(x)})}};else f[k]={stringValue:String(v)}}return f;}
function fsDocToObj(d){let o={};for(const[k,v]of Object.entries(d.fields||{})){if(v.stringValue!==undefined)o[k]=v.stringValue;else if(v.integerValue!==undefined)o[k]=Number(v.integerValue);else if(v.doubleValue!==undefined)o[k]=v.doubleValue;else if(v.booleanValue!==undefined)o[k]=v.booleanValue;else if(v.nullValue!==undefined)o[k]=null;else o[k]=v}return o;}
async function fsSet(collection,id,obj,merge=false){
  let url=`${fsBase()}/${collection}/${encodeURIComponent(id)}?key=${encodeURIComponent(CONFIG.firestoreApiKey)}`;
  let method=merge?"PATCH":"PATCH";
  let r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fsFields(obj)})});
  if(!r.ok)throw new Error("Firestore SET "+r.status);return r.json();
}
async function fsDelete(collection,id){let r=await fetch(`${fsBase()}/${collection}/${encodeURIComponent(id)}?key=${encodeURIComponent(CONFIG.firestoreApiKey)}`,{method:"DELETE"});if(!r.ok)throw new Error("Firestore DELETE "+r.status);}

/* ---------- TMDB ---------- */
const IMG=p=>p?`https://image.tmdb.org/t/p/w500${p}`:"";
async function tmdb(path,params={}){
  const u=new URL(`https://api.themoviedb.org/3/${path}`);
  u.searchParams.set("api_key",CONFIG.tmdbApiKey);
  u.searchParams.set("language",state.lang==="bn"?"bn-BD":state.lang==="hi"?"hi-IN":CONFIG.tmdbLang);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  let r=await fetch(u);if(!r.ok)throw new Error("TMDB "+r.status);return r.json();
}
async function searchTMDB(q){return tmdb("search/movie",{query:q,include_adult:"false",page:"1"});}

/* ---------- User data ---------- */
async function saveUser(){
  if(!uid()||uid()==="0")return;
  let u=TG?.initDataUnsafe?.user||{};
  await fsSet("users",uid(),{telegram_id:uid(),username:u.username||"",first_name:u.first_name||"",language:state.lang,last_active:Date.now()});
}
function localFavourite(id){return state.favourites.includes(String(id));}
function toggleFavourite(id){id=String(id);if(localFavourite(id))state.favourites=state.favourites.filter(x=>x!==id);else state.favourites.unshift(id);localStorage.setItem("favourites",JSON.stringify(state.favourites));toast(localFavourite(id)?"❤️ Added":"Removed");render();}
function addViewed(id){id=String(id);state.viewed=[id,...state.viewed.filter(x=>x!==id)].slice(0,20);localStorage.setItem("viewed",JSON.stringify(state.viewed));}

/* ---------- UI shell ---------- */
function shell(content){
  document.getElementById("app").innerHTML=`
  <header class="top"><div class="toprow">
    <button class="iconbtn" onclick="openMenu()">☰</button>
    <div class="brand">${esc(CONFIG.botName)}</div><span class="pill">Prime <b>Scene</b></span>
    <button class="iconbtn" onclick="state.page='search';render()">⌕</button>
  </div></header>
  <main class="screen">${content}</main>
  ${state.page!=="admin"?`<nav class="bottom">
    <button class="nav ${state.page==='home'?'active':''}" onclick="state.page='home';render()"><span>🏠</span>${t("home")}</button>
    <button class="nav ${state.page==='movies'?'active':''}" onclick="state.page='movies';render()"><span>🎬</span>${t("movies")}</button>
    <button class="nav ${state.page==='favourites'?'active':''}" onclick="state.page='favourites';render()"><span>❤️</span>${t("fav")}</button>
    <button class="nav ${state.page==='profile'?'active':''}" onclick="state.page='profile';render()"><span>👤</span>${t("profile")}</button>
  </nav>`:""}`;
}
function openMenu(){
 document.body.insertAdjacentHTML("beforeend",`<div id="menu" class="menu" onclick="if(event.target.id==='menu')closeMenu()"><aside class="drawer">
 <div class="toprow"><b style="flex:1">Menu</b><button class="iconbtn" onclick="closeMenu()">×</button></div>
 ${["movies","favourites","profile"].map(x=>`<button class="btn" onclick="closeMenu();state.page='${x}';render()">🎬 ${t(x==='favourites'?'fav':x)}</button>`).join("")}
 <button class="btn" onclick="closeMenu();state.page='request';render()">📩 ${t("request")}</button>
 <button class="btn" onclick="setLang('bn')">🇧🇩 বাংলা</button><button class="btn" onclick="setLang('en')">🇬🇧 English</button><button class="btn" onclick="setLang('hi')">🇮🇳 हिन्दी</button>
 ${isAdmin()?`<button class="btn primary" onclick="closeMenu();state.page='admin';renderAdmin()">👨‍💼 ${t("admin")}</button>`:""}
 <button class="btn" onclick="closeMenu()">◉ Telegram</button>
 </aside></div>`);
}
function closeMenu(){document.getElementById("menu")?.remove()}
function setLang(l){state.lang=l;localStorage.setItem("lang",l);closeMenu();render();saveUser().catch(()=>{});}

/* ---------- Movies ---------- */
function movieCard(m){
 let id=m.id||m.tmdb_id;return `<article class="movie" onclick='openMovie(${JSON.stringify(m).replace(/'/g,"&#39;")})'>
 <img class="poster" src="${esc(IMG(m.poster_path||m.poster))}" onerror="this.style.display='none'">
 <div class="movie-body"><div class="movie-title">${esc(m.title||m.movie_name||"Untitled")}</div>
 <div class="movie-meta"><span class="rating">★ ${Number(m.vote_average||m.rating||0).toFixed(1)}</span> · ${esc((m.release_date||m.year||"").slice(0,4))}</div></div></article>`;
}
async function loadMovies(){
 try{
  let d=await fsList("movies");state.movies=(d.documents||[]).map(x=>({id:x.name.split("/").pop(),...fsDocToObj(x)}));
 }catch(e){state.movies=[]}
 if(!state.movies.length){try{let d=await tmdb("movie/popular",{page:1});state.movies=d.results||[]}catch(e){}}
}
function home(){
 let movies=state.movies.slice(0,10);
 return `<div class="hero-tabs"><div class="hero-tab active">🆕 New Movies<small>LATEST UPLOADS</small></div><div class="hero-tab">🔥 Trending<small>MOST WATCHED</small></div></div>
 <div class="chips"><span class="chip active">All Movies</span><span class="chip">Hollywood Movie Hindi</span><span class="chip">Bangla Movies</span></div>
 <div class="card"><div class="eyebrow">▣ MOVIE ZONE</div><div class="title">Cinema Library</div><div class="muted">Curated movies, web series and premium entertainment updates.</div><div class="cta"><button class="btn primary full" onclick="state.page='movies';render()">◉ How to Watch</button></div></div>
 <div class="section-head"><h3>🆕 ${t("recent")}</h3><button class="btn" onclick="state.page='movies';render()">See all</button></div>
 <div class="movie-grid">${movies.length?movies.map(movieCard).join(""):`<div class="empty">${t("loading")}</div>`}</div>`;
}
function moviesPage(){
 let list=state.movies;
 if(state.search)list=list.filter(m=>(m.title||m.movie_name||"").toLowerCase().includes(state.search.toLowerCase()));
 return `<div class="search"><input value="${esc(state.search)}" placeholder="Search movies..." oninput="state.search=this.value;render()"><button class="btn primary">⌕</button></div>
 <div class="section-head"><h3>🎬 ${t("movies")}</h3><span class="muted">${list.length}</span></div>
 <div class="movie-grid">${list.length?list.map(movieCard).join(""):`<div class="empty">${t("no")}</div>`}</div>`;
}
async function openMovie(m){state.selected=m;addViewed(m.id||m.tmdb_id);render();}
function detail(){
 let m=state.selected||{};return `<button class="btn" onclick="state.page='movies';render()">← ${t("back")}</button>
 <img class="detail-backdrop" src="${esc(IMG(m.backdrop_path||m.poster_path||m.poster))}">
 <img class="detail-poster" src="${esc(IMG(m.poster_path||m.poster))}">
 <div class="section-head"><h2>${esc(m.title||m.movie_name||"Untitled")}</h2><button class="btn" onclick="toggleFavourite('${esc(m.id||m.tmdb_id)}')">${localFavourite(m.id||m.tmdb_id)?"❤️":"🤍"}</button></div>
 <div><span class="badge">⭐ ${Number(m.vote_average||m.rating||0).toFixed(1)}</span><span class="badge">📅 ${esc((m.release_date||m.year||"").slice(0,4))}</span><span class="badge">🎭 ${esc((m.genres||m.genre||"").toString())}</span></div>
 <div class="card"><div class="eyebrow">OVERVIEW</div><div class="muted">${esc(m.overview||"No overview available.")}</div></div>
 <div class="card"><div class="title">▶️ Servers</div><div class="server">
 ${CONFIG.server1Enabled?`<button class="btn primary" onclick="playServer(1)">Server 1</button>`:""}
 ${CONFIG.server2Enabled?`<button class="btn primary" onclick="playServer(2)">Server 2</button>`:""}
 ${CONFIG.server3Enabled?`<button class="btn primary" onclick="playServer(3)">Server 3</button>`:""}
 </div></div>
 <div class="card"><button class="btn primary full" onclick="state.page='request';render()">📩 ${t("request")}</button></div>`;
}
function playServer(n){toast("Server "+n+" selected");}

/* ---------- Search / request / profile ---------- */
function searchPage(){return `<div class="search"><input autofocus value="${esc(state.search)}" placeholder="Movie name..." oninput="state.search=this.value;render()"><button class="btn primary" onclick="doTMDBSearch()">Search</button></div><div id="searchResults" class="movie-grid"></div>`}
async function doTMDBSearch(){let box=document.getElementById("searchResults");if(!box)return;box.innerHTML=`<div class="empty">${t("loading")}</div>`;try{let d=await searchTMDB(state.search);box.innerHTML=(d.results||[]).map(movieCard).join("")||`<div class="empty">${t("no")}</div>`}catch(e){box.innerHTML=`<div class="empty">TMDB Error</div>`}}
async function submitRequest(){
 let name=document.getElementById("reqName")?.value.trim();if(!name){toast("Movie name required");return}
 let year=document.getElementById("reqYear")?.value.trim()||"";
 let id=uid()+"_"+name.toLowerCase().replace(/[^a-z0-9\u0980-\u09ff ]/g,"").replace(/\s+/g,"_").slice(0,60);
 let r={user_id:uid(),username:TG?.initDataUnsafe?.user?.username||"",first_name:userName(),movie_name:name,year,status:"pending",source:"webapp",language:state.lang,created_time:Date.now()};
 try{await fsSet("requests",id,{...r,document_id:id});toast("✅ "+t("send"));document.getElementById("reqName").value="";document.getElementById("reqYear").value=""}catch(e){toast("❌ Firestore error")}}
function requestPage(){return `<div class="card"><div class="eyebrow">📩 MOVIE REQUEST</div><div class="title">${t("request")}</div><div class="muted">Send any movie name and release year. It will appear in Admin → User Requests.</div><div class="form" style="margin-top:12px"><input id="reqName" placeholder="Movie Name"><input id="reqYear" inputmode="numeric" placeholder="Release Year (optional)"><button class="btn primary" onclick="submitRequest()">${t("send")}</button></div></div>`}
function profile(){
 let u=TG?.initDataUnsafe?.user||{};return `<div class="card"><div class="toprow"><div style="font-size:42px">👤</div><div style="flex:1"><div class="title">${esc(u.first_name||"Guest")}</div><div class="muted">@${esc(u.username||"no_username")}</div></div><button class="btn" onclick="setLang('bn')">বাংলা</button><button class="btn" onclick="setLang('en')">EN</button></div></div>
 <div class="card"><div class="section-head"><h3>OVERVIEW</h3></div><div class="movie-grid"><div class="stat">❤️<b>${state.favourites.length}</b><span class="muted">Favourite</span></div><div class="stat">👁<b>${state.viewed.length}</b><span class="muted">Viewed</span></div></div></div>
 <div class="card"><button class="btn full" onclick="state.page='request';render()">📩 ${t("request")}</button></div>`;
}
      
      
/* ---------- Admin ---------- */
async function adminLoad(){
 try{let d=await fsList("requests");state.requests=(d.documents||[]).map(x=>({id:x.name.split("/").pop(),...fsDocToObj(x)}));}catch(e){state.requests=[]}
 let map={};for(const r of state.requests){let id=String(r.user_id||"unknown");if(!map[id])map[id]={user_id:id,first_name:r.first_name||"Unknown",username:r.username||"",requests:[]};map[id].requests.push(r)}
 state.users=Object.values(map).sort((a,b)=>(b.requests[0]?.created_time||0)-(a.requests[0]?.created_time||0));
 try{let d=await fsGet("config/main");state.cfg=fsDocToObj(d)}catch(e){state.cfg={...CONFIG}}
}
function adminShell(body){document.getElementById("app").innerHTML=`<div class="admin"><div class="toprow" style="margin-bottom:12px"><button class="iconbtn" onclick="state.page='home';render()">←</button><div class="brand">👨‍💼 Admin Panel</div><span class="pill">${isAdmin()?"ADMIN":"NO ACCESS"}</span></div>${body}</div>`}
function adminDashboard(){
 let pending=state.requests.filter(x=>String(x.status||"pending")!=="completed").length;
 return `<div class="admin-nav">${["dashboard","movies","users","requests","config"].map(x=>`<button class="btn ${state.adminTab===x?"primary":""}" onclick="state.adminTab='${x}';renderAdmin()">${x}</button>`).join("")}</div>
 <div class="grid"><div class="stat">📩<b>${state.requests.length}</b>Total Requests</div><div class="stat">🟡<b>${pending}</b>Pending</div><div class="stat">👥<b>${state.users.length}</b>Users</div><div class="stat">🎬<b>${state.movies.length}</b>Movies</div></div>
 <div class="card"><div class="title">📊 Admin Dashboard</div><div class="muted">Central overview of movies, users and requests.</div></div>`;
}
function adminUsers(){
 return `<div class="admin-nav"><button class="btn" onclick="state.adminTab='dashboard';renderAdmin()">← Dashboard</button></div><div class="section-head"><h3>👥 User List</h3></div><div class="card table"><div class="row head"><span>User</span><span>ID</span><span>Requests</span><span>Action</span></div>${state.users.map((u,i)=>`<div class="row"><span>${esc(u.first_name)}<br><small>@${esc(u.username)}</small></span><span>${esc(u.user_id)}</span><span>${u.requests.length}</span><span><button class="btn primary" onclick="adminUser(${i})">Open</button></span></div>`).join("")||`<div class="empty">No users</div>`}</div>`;
}
function adminUser(i){let u=state.users[i];document.getElementById("app").innerHTML=`<div class="admin"><button class="btn" onclick="state.adminTab='users';renderAdmin()">← Back</button><div class="card"><div class="title">👤 ${esc(u.first_name)}</div><div class="muted">🆔 ${esc(u.user_id)} · @${esc(u.username)}</div><h3>📨 Total Requests: ${u.requests.length}</h3></div>${u.requests.map((r,j)=>`<div class="card"><b>${j+1}. ${esc(r.movie_name)}</b><div class="muted">📅 ${esc(r.year||"N/A")} · 🕐 ${new Date(Number(r.created_time||0)).toLocaleString()} · ${String(r.status||"pending")}</div><div class="cta">${r.status!=="completed"?`<button class="btn ok" onclick="completeReq('${esc(r.id)}')">✅ Complete</button>`:""}<button class="btn danger" onclick="deleteReq('${esc(r.id)}')">🗑 Delete</button><button class="btn primary" onclick="adminReply('${esc(u.user_id)}')">💬 Reply</button></div></div>`).join("")}</div>`}
async function completeReq(id){try{await fsSet("requests",id,{status:"completed"});toast("✅ Completed");await adminLoad();renderAdmin()}catch(e){toast("Error")}}
async function deleteReq(id){if(!confirm("Delete this request?"))return;try{await fsDelete("requests",id);toast("🗑 Deleted");await adminLoad();renderAdmin()}catch(e){toast("Error")}}
function adminReply(uid){let text=prompt("Reply message:");if(!text)return;try{TG?.sendData(JSON.stringify({type:"admin_reply",user_id:String(uid),text}));toast("Reply data sent to bot");}catch(e){toast("Telegram WebApp unavailable")}}
function adminRequests(){
 return `<div class="admin-nav"><button class="btn" onclick="state.adminTab='dashboard';renderAdmin()">← Dashboard</button></div><div class="card table"><div class="row head"><span>Movie</span><span>User</span><span>Status</span><span>Action</span></div>${state.requests.sort((a,b)=>Number(b.created_time||0)-Number(a.created_time||0)).map(r=>`<div class="row"><span>${esc(r.movie_name)}</span><span>${esc(r.first_name||r.user_id)}</span><span>${esc(r.status||"pending")}</span><span><button class="btn primary" onclick="adminRequest('${esc(r.id)}')">Open</button></span></div>`).join("")||`<div class="empty">No requests</div>`}</div>`;
}
function adminRequest(id){let r=state.requests.find(x=>x.id===id);if(!r)return;document.getElementById("app").innerHTML=`<div class="admin"><button class="btn" onclick="state.adminTab='requests';renderAdmin()">← Back</button><div class="card"><div class="title">📩 Request Details</div><div class="muted">👤 ${esc(r.first_name)} · 🆔 ${esc(r.user_id)}<br>🎬 ${esc(r.movie_name)}<br>📅 ${esc(r.year||"N/A")}<br>🕐 ${new Date(Number(r.created_time||0)).toLocaleString()}<br>📌 ${esc(r.status||"pending")}</div><div class="cta">${r.status!=="completed"?`<button class="btn ok" onclick="completeReq('${esc(r.id)}')">✅ Mark Complete</button>`:""}<button class="btn danger" onclick="deleteReq('${esc(r.id)}')">🗑 Delete</button><button class="btn primary" onclick="adminReply('${esc(r.user_id)}')">💬 Reply</button></div></div></div>`}
function adminMovies(){
 return `<div class="admin-nav"><button class="btn" onclick="state.adminTab='dashboard';renderAdmin()">← Dashboard</button><button class="btn primary" onclick="adminMovieForm()">＋ Add</button></div><div class="card table"><div class="row head"><span>Movie</span><span>Year</span><span>Rating</span><span>Action</span></div>${state.movies.map(m=>`<div class="row"><span>${esc(m.title||m.movie_name)}</span><span>${esc((m.release_date||m.year||"").slice(0,4))}</span><span>⭐${Number(m.vote_average||m.rating||0).toFixed(1)}</span><span><button class="btn danger" onclick="deleteMovie('${esc(m.id)}')">🗑</button></span></div>`).join("")}</div>`;
}
function adminMovieForm(){document.getElementById("app").innerHTML=`<div class="admin"><button class="btn" onclick="state.adminTab='movies';renderAdmin()">← Back</button><div class="card"><h3>🎬 Add Movie</h3><div class="form"><input id="mId" placeholder="Movie ID"><input id="mTitle" placeholder="Movie title"><input id="mPoster" placeholder="Poster path or full URL"><input id="mYear" placeholder="Year"><input id="mRating" placeholder="Rating"><input id="mGenre" placeholder="Genre"><textarea id="mOverview" placeholder="Overview"></textarea><input id="mS1" placeholder="Server 1 URL"><input id="mS2" placeholder="Server 2 URL"><input id="mS3" placeholder="Server 3 URL"><button class="btn primary" onclick="saveMovie()">Save Movie</button></div></div></div>`}
async function saveMovie(){let id=document.getElementById("mId").value.trim();if(!id){toast("ID required");return}let m={title:document.getElementById("mTitle").value,poster:document.getElementById("mPoster").value,year:document.getElementById("mYear").value,rating:Number(document.getElementById("mRating").value||0),genre:document.getElementById("mGenre").value,overview:document.getElementById("mOverview").value,server1:document.getElementById("mS1").value,server2:document.getElementById("mS2").value,server3:document.getElementById("mS3").value,updated_time:Date.now()};try{await fsSet("movies",id,m);toast("Saved");await adminLoad();state.adminTab="movies";renderAdmin()}catch(e){toast("Save failed")}}
async function deleteMovie(id){if(!confirm("Delete movie?"))return;try{await fsDelete("movies",id);await adminLoad();renderAdmin()}catch(e){toast("Delete failed")}}
async function adminConfig(){
 let c={...CONFIG,...state.cfg};return `<div class="admin-nav"><button class="btn" onclick="state.adminTab='dashboard';renderAdmin()">← Dashboard</button></div><div class="card"><h3>⚙️ Central Config</h3>
 ${[["maintenance_mode","🚧 Maintenance mode"],["server1_enabled","🔧 Server 1"],["server2_enabled","🔧 Server 2"],["server3_enabled","🔧 Server 3"],["trending_enabled","🔥 Trending"],["recently_added_enabled","🆕 Recently Added"],["recently_viewed_enabled","📜 Recently Viewed"],["favourite_enabled","❤️ Favourite"],["broadcast_enabled","📢 Broadcast UI"]].map(([k,l])=>`<div class="switch"><span>${l}</span><input type="checkbox" ${c[k]?"checked":""} onchange="updateConfig('${k}',this.checked)"></div>`).join("")}</div>
 <div class="card"><div class="muted">Firestore Project</div><b>${esc(CONFIG.firebaseProjectId)}</b><br><div class="muted">TMDB configured: ${CONFIG.tmdbApiKey?"YES":"NO"}</div></div>`;
}
async function updateConfig(k,v){try{await fsSet("config","main",{[k]:v});state.cfg[k]=v;toast("Config updated")}catch(e){toast("Config save failed")}}
async function renderAdmin(){if(!isAdmin()){document.getElementById("app").innerHTML=`<div class="empty">Access denied</div>`;return}await adminLoad();let b=state.adminTab==="users"?adminUsers():state.adminTab==="requests"?adminRequests():state.adminTab==="movies"?adminMovies():state.adminTab==="config"?await adminConfig():adminDashboard();adminShell(b)}

/* ---------- Router ---------- */
async function render(){
 if(state.page==="admin"){renderAdmin();return}
 let content=state.page==="home"?home():state.page==="movies"?moviesPage():state.page==="search"?searchPage():state.page==="favourites"?`<div class="section-head"><h3>❤️ ${t("fav")}</h3></div><div class="movie-grid">${state.movies.filter(m=>localFavourite(m.id||m.tmdb_id)).map(movieCard).join("")||`<div class="empty">${t("no")}</div>`}</div>`:state.page==="profile"?profile():state.page==="request"?requestPage():state.page==="detail"?detail():home();
 shell(content);
 if(state.page==="search")doTMDBSearch();
}
(async()=>{try{await loadMovies();await saveUser()}catch(e){}render()})();
</script>
</body>
</html>
