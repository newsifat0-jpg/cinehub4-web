<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12"><title>Cine Hub4</title><link rel="stylesheet" href="style.css">
<script src="language.js"></script>
</head>

<div id="app">
<header class="topbar">

<button class="icon-btn" id="menuBtn">⋮</button>
</header>
<main id="screen"></main>
<nav class="bottom-nav">
<button data-page="home" class="nav-item active"><b>⌂</b><span data-i18n="Home">Home</span></button>
<button data-page="movies" class="nav-item"><b>🎬</b><span data-i18n="Movies">Movies</span></button>

</aside></div><div id="toast"></div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="config.js"></script><script src="app.js"></script>
