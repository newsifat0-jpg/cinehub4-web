<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c14"><title>Cine Hub4</title>
<link rel="stylesheet" href="style.css?v=20260818b">
<script src="language.js?v=20260818b"></script>
</head>
<body>
<div id="appSplash"><div class="splash-logo">P</div><div class="splash-name">CINE <span>HUB4</span></div><div class="splash-line"></div></div>
<div id="app">
<header class="topbar">
<button class="icon-btn" id="backBtn">‹</button>
<div class="brand"><span class="brand-text">PRIME <span>SCENE</span></span></div>
<button class="icon-btn" id="menuBtn">⋮</button>
</header>
<main id="screen"></main>
<nav class="bottom-nav">
<button data-page="movies" class="nav-item active"><b class="nav-ico movies-ico"></b><span data-i18n="Movies">Movies</span></button>
<button data-page="series" class="nav-item"><b class="nav-ico series-ico"></b><span data-i18n="Series">Series</span></button>
<button data-page="adult" class="nav-item"><b class="nav-ico adult-ico"></b><span data-i18n="Adult">Adult</span></button>
<button data-page="profile" class="nav-item"><b class="nav-ico user-ico"></b><span data-i18n="User">User</span></button>
</nav>
<div id="drawer" class="drawer-wrap hidden">
<div class="drawer-backdrop"></div>
<aside class="drawer">
<div class="drawer-head"><div><strong>Prime Scene</strong><small>Movie Mini App</small></div><button id="closeDrawer" type="button">×</button></div>
<button type="button" data-page="movies">🎬 <span data-i18n="Movies">Movies</span></button>
<button type="button" data-page="series">▤ <span data-i18n="Series">Series</span></button>
<button type="button" data-page="adult">🔞 <span data-i18n="Adult">Adult</span></button>
<button type="button" data-page="points">🪙 <span data-i18n="My Points">My Points</span></button>
<button type="button" data-page="tasks">✓ <span data-i18n="Daily Tasks">Daily Tasks</span></button>
<button type="button" data-page="profile">◉ <span data-i18n="User">User</span></button>
<div class="drawer-spacer"></div>
<button type="button" data-page="settings">⚙ <span data-i18n="Settings">Settings</span></button>
<button type="button" data-page="telegram">◉ <span>Telegram</span></button>
<button id="adminPanelBtn" class="admin-only hidden" type="button">🛡️ <span data-i18n="Admin Panel">Admin Panel</span></button>
</aside>
</div>
<div id="toast"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js?v=20260818b"></script>
<script src="config.js?v=20260818b"></script>
<script src="app.js?v=20260818b"></script>
</body>
  </html>
