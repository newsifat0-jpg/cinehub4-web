<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a12">
  <title>Cine Hub4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="logo">C4</div>
    <h1>Cine Hub4</h1>
    <p>Movie • Download • Entertainment</p>
    <div class="loader"></div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <button class="round" id="menuBtn">☰</button>
      <div class="brand"><div class="mini-logo">C4</div><div><strong>Cine Hub4</strong><small>Movie Mini App</small></div></div>
      <button class="round" onclick="openPage('profile')">👤</button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button onclick="openPage('home')">⌂<span data-bn="হোম" data-en="Home">হোম</span></button>
      <button onclick="openPage('movies')">▣<span data-bn="মুভি" data-en="Movies">মুভি</span></button>
      <button onclick="openPage('search')">⌕<span data-bn="সার্চ" data-en="Search">সার্চ</span></button>
      <button onclick="openPage('points')">★<span data-bn="পয়েন্ট" data-en="Points">পয়েন্ট</span></button>
      <button onclick="openPage('profile')">●<span data-bn="প্রোফাইল" data-en="Profile">প্রোফাইল</span></button>
    </nav>
  </div>

  <div id="drawer" class="drawer">
    <div class="drawer-card">
      <div class="drawer-head"><div class="brand"><div class="mini-logo">C4</div><strong>Cine Hub4</strong></div><button class="round" onclick="closeDrawer()">×</button></div>
      <div id="drawerItems"></div>
    </div>
  </div>

  <div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div>
  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
                                                                                                             </html>
