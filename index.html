<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cine Hub4</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #070b14; color: #fff; padding-bottom: 90px; }

  header { padding: 18px; background: #0d1422; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
  .logo { font-size: 22px; font-weight: 800; }
  .logo span { color: #6c63ff; }
  .header-btns { display: flex; gap: 8px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid #29334a; background: #151d2d; color: white; font-size: 16px; display: flex; align-items: center; justify-content: center; }

  .hero { margin: 18px; padding: 22px 20px; border-radius: 22px; background: linear-gradient(135deg, #6857e8, #08b7d9); }
  .hero small { opacity: .85; letter-spacing: .5px; }
  .hero h1 { margin: 8px 0; font-size: 25px; }
  .hero p { opacity: .9; line-height: 1.5; font-size: 14px; }
  .hero button { margin-top: 16px; border: 0; border-radius: 14px; padding: 12px 20px; font-weight: bold; color: #111; background: white; }

  .section { padding: 5px 18px; margin-top: 22px; }
  .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .section-title h2 { font-size: 18px; }
  .section-title span { color: #7d8aa5; font-size: 13px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 14px; }
  .chip { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; background: #151d2d; border: 1px solid #29334a; font-size: 13px; color: #b7c2d6; }
  .chip.active { background: #6c63ff; color: white; border-color: #6c63ff; }

  .movies { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .movie { background: #101725; border: 1px solid #202b40; border-radius: 16px; overflow: hidden; cursor: pointer; }
  .poster { height: 200px; background-size: cover; background-position: center; background-color: #151a27; display: flex; align-items: center; justify-content: center; color: #4a5670; font-size: 13px; position: relative; }
  .badge-new { position: absolute; top: 8px; left: 8px; background: #ff4757; font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: bold; }
  .movie-info { padding: 10px; }
  .movie-title { font-weight: bold; font-size: 14px; line-height: 1.35; min-height: 38px; }
  .meta { margin-top: 7px; color: #8c99b2; font-size: 11px; }
  .watch { width: 100%; margin-top: 9px; border: 0; border-radius: 10px; padding: 8px; background: linear-gradient(90deg, #6957ed, #09b7d5); color: white; font-weight: bold; font-size: 13px; }

  .search-box { margin: 0 18px 16px; }
  .search-box input { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid #29334a; background: #151d2d; color: white; font-size: 14px; }

  .empty-state { text-align: center; color: #6b7690; padding: 40px 20px; font-size: 14px; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: #0d1422; border-top: 1px solid #263149; display: flex; justify-content: space-around; align-items: center; z-index: 40; }
  nav button { background: none; border: 0; color: #8995ad; font-size: 11px; }
  nav .active { color: #4cc9f0; }
  nav div { font-size: 21px; margin-bottom: 2px; }

  .view { display: none; }
  .view.active { display: block; }

  .overlay { position: fixed; inset: 0; background: #070b14; z-index: 100; overflow-y: auto; display: none; }
  .overlay.active { display: block; }
  .overlay-top { position: sticky; top: 0; padding: 16px; background: rgba(13,20,34,0.9); backdrop-filter: blur(6px); z-index: 5; }
  .close-btn { width: 38px; height: 38px; border-radius: 12px; background: #151d2d; border: 1px solid #29334a; color: white; font-size: 18px; }
  .detail-poster { width: 100%; height: 380px; background-size: cover; background-position: center; background-color: #151a27; }
  .detail-body { padding: 20px; }
  .detail-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .detail-meta { color: #8c99b2; font-size: 13px; margin-bottom: 14px; }
  .detail-rating { display: inline-flex; align-items: center; gap: 5px; background: #151d2d; padding: 6px 12px; border-radius: 10px; margin-bottom: 14px; font-weight: bold; color: #ffd166; }
  .detail-overview { line-height: 1.6; color: #c3cbdb; font-size: 14px; margin-bottom: 20px; }
  .server-btn { display: block; width: 100%; padding: 14px; margin-bottom: 10px; border: 0; border-radius: 14px; background: linear-gradient(90deg, #6957ed, #09b7d5); color: white; font-weight: bold; font-size: 14px; }
  .fav-btn { display: block; width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #29334a; border-radius: 14px; background: #151d2d; color: #ffd166; font-weight: bold; font-size: 14px; }
  .request-btn { display: block; width: 100%; padding: 14px; margin-bottom: 10px; border: 0; border-radius: 14px; background: #2a3450; color: white; font-weight: bold; font-size: 14px; }

  .loading { text-align: center; padding: 30px; color: #6b7690; }
  .spinner { width: 30px; height: 30px; border: 3px solid #29334a; border-top-color: #6c63ff; border-radius: 50%; margin: 0 auto 10px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .profile-card { margin: 18px; padding: 20px; background: #101725; border: 1px solid #202b40; border-radius: 18px; text-align: center; }
  .profile-avatar { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #6857e8, #08b7d9); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
  .stat-row { display: flex; gap: 10px; margin: 18px; }
  .stat-box { flex: 1; background: #101725; border: 1px solid #202b40; border-radius: 14px; padding: 16px; text-align: center; }
  .stat-box .num { font-size: 22px; font-weight: 800; color: #4cc9f0; }
  .stat-box .lbl { font-size: 12px; color: #8c99b2; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">Cine <span>Hub4</span></div>
  <div class="header-btns">
    <button class="icon-btn" id="langToggle">EN</button>
    <button class="icon-btn" onclick="switchView('search')">⌕</button>
  </div>
</header>

<!-- HOME -->
<div class="view active" id="view-home">
  <section class="hero">
    <small id="t-welcome">WELCOME TO CINE HUB4</small>
    <h1 id="t-heroTitle">Movies & Series</h1>
    <p id="t-heroDesc">নতুন মুভি, ট্রেন্ডিং কনটেন্ট এবং তোমার পছন্দের সিনেমা এক জায়গায়।</p>
    <button onclick="switchView('movies')" id="t-explore">▶ Explore Now</button>
  </section>

  <section class="section">
    <div class="section-title">
      <h2 id="t-trending">🔥 Trending</h2>
      <span onclick="switchView('movies')">See All</span>
    </div>
    <div class="movies" id="trendingGrid"><div class="loading"><div class="spinner"></div></div></div>
  </section>

  <section class="section">
    <div class="section-title">
      <h2 id="t-latest">🆕 Latest Movies</h2>
      <span onclick="switchView('movies')">See All</span>
    </div>
    <div class="movies" id="latestGrid"><div class="loading"><div class="spinner"></div></div></div>
  </section>
</div>

<!-- MOVIES -->
<div class="view" id="view-movies">
  <section class="section" style="margin-top:16px">
    <div class="section-title"><h2 id="t-allMovies">🎬 All Movies</h2></div>
  </section>
  <div class="chips" id="categoryChips"></div>
  <section class="section" style="margin-top:0">
    <div class="movies" id="allMoviesGrid"><div class="loading"><div class="spinner"></div></div></div>
  </section>
</div>

<!-- SEARCH -->
<div class="view" id="view-search">
  <section class="section" style="margin-top:16px">
    <div class="section-title"><h2 id="t-search">🔍 Search</h2></div>
  </section>
  <div class="search-box"><input type="text" id="searchInput" placeholder="মুভির নাম লিখুন..." oninput="onSearchInput()"></div>
  <section class="section" style="margin-top:0">
    <div class="movies" id="searchGrid"></div>
    <div class="empty-state" id="searchEmpty" style="display:none" data-en="Type a movie name to search your collection" data-bn="মুভির নাম লিখুন সার্চ করার জন্য">মুভির নাম লিখুন সার্চ করার জন্য</div>
  </section>
</div>

<!-- FAVORITE -->
<div class="view" id="view-favorite">
  <section class="section" style="margin-top:16px">
    <div class="section-title"><h2 id="t-favTitle">❤️ Favourite</h2></div>
  </section>
  <section class="section" style="margin-top:0">
    <div class="movies" id="favGrid"><div class="loading"><div class="spinner"></div></div></div>
  </section>
</div>

<!-- PROFILE -->
<div class="view" id="view-profile">
  <div class="profile-card">
    <div class="profile-avatar" id="profileInitial">?</div>
    <div style="font-size:18px;font-weight:bold" id="profileName">—</div>
    <div style="color:#8c99b2;font-size:13px;margin-top:4px" id="profileUsername">—</div>
  </div>
  <div class="stat-row">
    <div class="stat-box"><div class="num" id="statFav">0</div><div class="lbl" id="t-favLbl">Favourites</div></div>
    <div class="stat-box"><div class="num" id="statReq">0</div><div class="lbl" id="t-reqLbl">Requests</div></div>
  </div>
</div>

<nav>
  <button class="active" data-view="home" onclick="switchView('home')"><div>⌂</div><span data-en="Home" data-bn="হোম">হোম</span></button>
  <button data-view="movies" onclick="switchView('movies')"><div>🎬</div><span data-en="Movies" data-bn="মুভি">মুভি</span></button>
  <button data-view="search" onclick="switchView('search')"><div>🔎</div><span data-en="Search" data-bn="সার্চ">সার্চ</span></button>
  <button data-view="favorite" onclick="switchView('favorite')"><div>♡</div><span data-en="Favorite" data-bn="ফেভারিট">ফেভারিট</span></button>
  <button data-view="profile" onclick="switchView('profile')"><div>👤</div><span data-en="Profile" data-bn="প্রোফাইল">প্রোফাইল</span></button>
</nav>

<!-- MOVIE DETAIL OVERLAY -->
<div class="overlay" id="detailOverlay">
  <div class="overlay-top"><button class="close-btn" onclick="closeDetail()">✕</button></div>
  <div id="detailContent"><div class="loading"><div class="spinner"></div></div></div>
</div>

<script>
// =====================================================================
// ⚠️ ADJUST THESE — Firebase config + Firestore ফিল্ড নেম
// =====================================================================

// ১. Firebase Console → Project Settings → General → Your apps → Web app
//    থেকে সম্পূর্ণ firebaseConfig কপি করে এখানে বসান (নিচেরটা placeholder)
const firebaseConfig = {
  apiKey: "AIzaSyBdoLUyIhL83s7w72eOU_cEdF5aAcqfDdQ",
  authDomain: "cinehub4-d1773.firebaseapp.com",
  projectId: "cinehub4-d1773"
};

// ২. TMDB API Key (আপনার cfg থেকে)
const TMDB_API_KEY = "2f84235873a478ed4c3601374daaf7d4";

// ৩. movies collection-এর document-এ ফিল্ড নেম যদি আলাদা হয়, এখানে বদলান:
const FIELD = {
  title: "title",
  year: "year",
  poster: "poster",          // পুরো URL সেভ থাকলে এটাই; TMDB poster_path হলে posterIsPath: true করুন
  posterIsPath: false,
  tmdbId: "tmdb_id",
  genres: "genres",
  overview: "overview",
  server1_link: "server1_link", server1_status: "server1_status",
  server2_link: "server2_link", server2_status: "server2_status",
  server3_link: "server3_link", server3_status: "server3_status",
  createdTime: "created_time" // "recently added" সাজানোর জন্য
};

// =====================================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Telegram WebApp
let tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
let tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
let myUserId = tgUser ? String(tgUser.id) : "guest_" + Math.random().toString(36).substring(2,10);

// ---------------- LANGUAGE ----------------
let lang = localStorage.getItem("ch4_lang") || "bn";
function applyLang() {
  document.getElementById("langToggle").textContent = lang === "bn" ? "EN" : "বাং";
  document.querySelectorAll("[data-en]").forEach(el => {
    el.textContent = lang === "bn" ? (el.getAttribute("data-bn") || el.textContent) : el.getAttribute("data-en");
  });
  document.getElementById("t-welcome").textContent = lang === "bn" ? "স্বাগতম সিনে হাব৪ এ" : "WELCOME TO CINE HUB4";
  document.getElementById("t-heroTitle").textContent = lang === "bn" ? "মুভি ও সিরিজ" : "Movies & Series";
  document.getElementById("t-heroDesc").textContent = lang === "bn" ? "নতুন মুভি, ট্রেন্ডিং কনটেন্ট এবং তোমার পছন্দের সিনেমা এক জায়গায়।" : "New movies, trending content and all your favourite cinema in one place.";
  document.getElementById("t-explore").textContent = lang === "bn" ? "▶ এক্সপ্লোর করুন" : "▶ Explore Now";
  document.getElementById("t-trending").textContent = "🔥 " + (lang === "bn" ? "ট্রেন্ডিং" : "Trending");
  document.getElementById("t-latest").textContent = "🆕 " + (lang === "bn" ? "নতুন মুভি" : "Latest Movies");
  document.getElementById("t-allMovies").textContent = "🎬 " + (lang === "bn" ? "সব মুভি" : "All Movies");
  document.getElementById("t-search").textContent = "🔍 " + (lang === "bn" ? "সার্চ" : "Search");
  document.getElementById("t-favTitle").textContent = "❤️ " + (lang === "bn" ? "ফেভারিট" : "Favourite");
  document.getElementById("searchInput").placeholder = lang === "bn" ? "মুভির নাম লিখুন..." : "Type movie name...";
}
document.getElementById("langToggle").onclick = function() {
  lang = lang === "bn" ? "en" : "bn";
  localStorage.setItem("ch4_lang", lang);
  applyLang();
  renderAll();
};

// ---------------- VIEW SWITCH ----------------
function switchView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  if (name === "profile") loadProfile();
  if (name === "favorite") loadFavourites();
}

// ---------------- DATA ----------------
let allMovies = [];

function posterUrl(m) {
  let p = m[FIELD.poster];
  if (!p) return null;
  if (FIELD.posterIsPath) return "https://image.tmdb.org/t/p/w500" + p;
  return p;
}

function movieCardHtml(m, isNew) {
  const poster = posterUrl(m);
  const posterStyle = poster ? `style="background-image:url('${poster}')"` : "";
  const title = m[FIELD.title] || "Untitled";
  const year = m[FIELD.year] || "";
  const rating = (m._liveRating !== undefined ? m._liveRating : (m.rating || "—"));
  return `
    <div class="movie" onclick="openDetail('${m._id}')">
      <div class="poster" ${posterStyle}>${poster ? "" : "No Poster"}${isNew ? '<div class="badge-new">NEW</div>' : ""}</div>
      <div class="movie-info">
        <div class="movie-title">${title}</div>
        <div class="meta">⭐ ${rating} • ${year}</div>
        <button class="watch">▶ ${lang === "bn" ? "দেখুন" : "Watch Now"}</button>
      </div>
    </div>`;
}

function loadMovies() {
  db.collection("movies").limit(200).get().then(snap => {
    allMovies = [];
    snap.forEach(doc => {
      let d = doc.data();
      d._id = doc.id;
      allMovies.push(d);
    });
    renderAll();
  }).catch(err => {
    console.error(err);
    document.getElementById("trendingGrid").innerHTML = `<div class="empty-state">⚠️ ${err.message}</div>`;
  });
}

function renderAll() {
  // Trending: favourite_count / request_count থাকলে সেটা দিয়ে সাজানো, না থাকলে rating দিয়ে
  let trending = [...allMovies].sort((a,b) => (b.rating||0) - (a.rating||0)).slice(0, 6);
  let latest = [...allMovies].sort((a,b) => {
    let ta = a[FIELD.createdTime] ? new Date(a[FIELD.createdTime]).getTime() : 0;
    let tb = b[FIELD.createdTime] ? new Date(b[FIELD.createdTime]).getTime() : 0;
    return tb - ta;
  }).slice(0, 6);

  document.getElementById("trendingGrid").innerHTML = trending.length
    ? trending.map(m => movieCardHtml(m, false)).join("")
    : `<div class="empty-state">${lang==="bn"?"কোনো মুভি নেই":"No movies yet"}</div>`;

  document.getElementById("latestGrid").innerHTML = latest.length
    ? latest.map((m,i) => movieCardHtml(m, i < 2)).join("")
    : `<div class="empty-state">${lang==="bn"?"কোনো মুভি নেই":"No movies yet"}</div>`;

  document.getElementById("allMoviesGrid").innerHTML = allMovies.length
    ? allMovies.map(m => movieCardHtml(m, false)).join("")
    : `<div class="empty-state">${lang==="bn"?"কোনো মুভি নেই":"No movies yet"}</div>`;

  renderCategoryChips();
}

function renderCategoryChips() {
  let cats = new Set();
  allMovies.forEach(m => {
    if (m[FIELD.genres]) String(m[FIELD.genres]).split(",").forEach(g => cats.add(g.trim()));
  });
  let html = `<div class="chip active" onclick="filterCategory(null,this)">${lang==="bn"?"সব":"All"}</div>`;
  cats.forEach(c => { if (c) html += `<div class="chip" onclick="filterCategory('${c}',this)">${c}</div>`; });
  document.getElementById("categoryChips").innerHTML = html;
}

function filterCategory(cat, el) {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  let filtered = cat ? allMovies.filter(m => (m[FIELD.genres]||"").includes(cat)) : allMovies;
  document.getElementById("allMoviesGrid").innerHTML = filtered.length
    ? filtered.map(m => movieCardHtml(m, false)).join("")
    : `<div class="empty-state">${lang==="bn"?"কোনো মুভি নেই":"No movies"}</div>`;
}

// ---------------- SEARCH (শুধু allMovies-এর মধ্যেই, TMDB না) ----------------
function onSearchInput() {
  let q = document.getElementById("searchInput").value.trim().toLowerCase();
  let grid = document.getElementById("searchGrid");
  let empty = document.getElementById("searchEmpty");
  if (!q) { grid.innerHTML = ""; empty.style.display = "block"; return; }
  let results = allMovies.filter(m => String(m[FIELD.title]||"").toLowerCase().includes(q));
  empty.style.display = results.length ? "none" : "block";
  if (!results.length) { empty.textContent = lang==="bn" ? "কোনো মুভি পাওয়া যায়নি" : "No movie found"; grid.innerHTML=""; return; }
  grid.innerHTML = results.map(m => movieCardHtml(m, false)).join("");
}

// ---------------- MOVIE DETAIL (Live TMDB fetch) ----------------
function openDetail(movieId) {
  let m = allMovies.find(x => x._id === movieId);
  if (!m) return;
  document.getElementById("detailOverlay").classList.add("active");
  document.getElementById("detailContent").innerHTML = `<div class="loading"><div class="spinner"></div></div>`;

  let tmdbId = m[FIELD.tmdbId];
  if (tmdbId) {
    fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_API_KEY}`)
      .then(r => r.json())
      .then(data => renderDetail(m, data))
      .catch(() => renderDetail(m, null));
  } else {
    renderDetail(m, null);
  }
}

function renderDetail(m, tmdbData) {
  const title = (tmdbData && tmdbData.title) || m[FIELD.title] || "Untitled";
  const year = m[FIELD.year] || (tmdbData && tmdbData.release_date ? tmdbData.release_date.substring(0,4) : "");
  const rating = tmdbData ? Number(tmdbData.vote_average||0).toFixed(1) : (m.rating || "—");
  const overview = (tmdbData && tmdbData.overview) || m[FIELD.overview] || "";
  const genres = tmdbData && tmdbData.genres ? tmdbData.genres.map(g=>g.name).join(", ") : (m[FIELD.genres]||"");
  const runtime = tmdbData ? tmdbData.runtime : "";
  const poster = tmdbData && tmdbData.poster_path ? "https://image.tmdb.org/t/p/w500"+tmdbData.poster_path : posterUrl(m);

  let servers = [];
  if (m[FIELD.server1_status] && m[FIELD.server1_link]) servers.push({n:1, l:m[FIELD.server1_link]});
  if (m[FIELD.server2_status] && m[FIELD.server2_link]) servers.push({n:2, l:m[FIELD.server2_link]});
  if (m[FIELD.server3_status] && m[FIELD.server3_link]) servers.push({n:3, l:m[FIELD.server3_link]});

  let actionHtml = servers.length
    ? servers.map(s => `<a class="server-btn" href="${s.l}" target="_blank">⬇️ ${lang==="bn"?"ডাউনলোড সার্ভার":"Download Server"} ${s.n}</a>`).join("")
    : `<button class="request-btn" onclick="requestMovie('${m._id}','${title.replace(/'/g,"")}','${year}')">📩 ${lang==="bn"?"রিকোয়েস্ট করুন":"Request Movie"}</button>`;

  document.getElementById("detailContent").innerHTML = `
    <div class="detail-poster" style="${poster?`background-image:url('${poster}')`:''}"></div>
    <div class="detail-body">
      <div class="detail-title">${title}</div>
      <div class="detail-meta">${year} ${runtime?" • "+runtime+" min":""} ${genres?" • "+genres:""}</div>
      <div class="detail-rating">⭐ ${rating}/10</div>
      <div class="detail-overview">${overview}</div>
      ${actionHtml}
      <button class="fav-btn" id="favActionBtn" onclick="toggleFavourite('${m._id}','${title.replace(/'/g,"")}','${year}')">⭐ ${lang==="bn"?"ফেভারিটে যোগ করুন":"Add to Favourite"}</button>
    </div>`;

  checkFavouriteState(m._id);
}

function closeDetail() { document.getElementById("detailOverlay").classList.remove("active"); }
  
// ---------------- FAVOURITE (bot-এর favourites collection-এর সাথেই সিঙ্ক) ----------------
function favDocId(movieId) { return myUserId + "_" + movieId; }

function checkFavouriteState(movieId) {
  db.collection("favourites").doc(favDocId(movieId)).get().then(doc => {
    let btn = document.getElementById("favActionBtn");
    if (!btn) return;
    if (doc.exists) {
      btn.textContent = "✅ " + (lang==="bn" ? "ফেভারিটে আছে" : "In Favourite");
      btn.dataset.state = "in";
    } else {
      btn.textContent = "⭐ " + (lang==="bn" ? "ফেভারিটে যোগ করুন" : "Add to Favourite");
      btn.dataset.state = "out";
    }
  });
}

function toggleFavourite(movieId, title, year) {
  let ref = db.collection("favourites").doc(favDocId(movieId));
  ref.get().then(doc => {
    if (doc.exists) {
      ref.delete().then(() => checkFavouriteState(movieId));
    } else {
      ref.set({
        user_id: myUserId,
        movie_id: movieId,
        title: title,
        year: year,
        added_time: new Date().toISOString()
      }).then(() => checkFavouriteState(movieId));
    }
  });
}

function loadFavourites() {
  let grid = document.getElementById("favGrid");
  grid.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  db.collection("favourites").where("user_id", "==", myUserId).get().then(snap => {
    if (snap.empty) {
      grid.innerHTML = `<div class="empty-state">${lang==="bn"?"আপনার কোনো ফেভারিট মুভি নেই":"You have no favourite movies yet"}</div>`;
      return;
    }
    let html = "";
    snap.forEach(doc => {
      let d = doc.data();
      let m = allMovies.find(x => x._id === d.movie_id) || { [FIELD.title]: d.title, [FIELD.year]: d.year, _id: d.movie_id };
      html += movieCardHtml(m, false);
    });
    grid.innerHTML = html;
  });
}

// ---------------- REQUEST (bot-এর requests collection-এর সাথেই সিঙ্ক, Admin Panel-এও দেখা যাবে) ----------------
function requestMovie(movieId, title, year) {
  let ref = db.collection("requests").doc(myUserId + "_" + movieId);
  ref.get().then(doc => {
    if (doc.exists && doc.data().status === "pending") {
      alert(lang==="bn" ? "আপনি আগেই রিকোয়েস্ট করেছেন" : "You already requested this");
      return;
    }
    ref.set({
      user_id: myUserId,
      username: tgUser ? (tgUser.username||"") : "",
      first_name: tgUser ? (tgUser.first_name||"") : "",
      movie_id: movieId,
      title: title,
      year: year,
      status: "pending",
      created_time: new Date().toISOString()
    }).then(() => {
      alert(lang==="bn" ? "✅ রিকোয়েস্ট পাঠানো হয়েছে" : "✅ Request sent successfully");
    });
  });
}
  
// ---------------- PROFILE ----------------
function loadProfile() {
  let name = tgUser ? (tgUser.first_name + (tgUser.last_name ? " "+tgUser.last_name : "")) : "Guest";
  document.getElementById("profileName").textContent = name;
  document.getElementById("profileUsername").textContent = tgUser && tgUser.username ? "@"+tgUser.username : "";
  document.getElementById("profileInitial").textContent = name.charAt(0).toUpperCase();

  db.collection("favourites").where("user_id","==",myUserId).get().then(s => {
    document.getElementById("statFav").textContent = s.size;
  });
  db.collection("requests").where("user_id","==",myUserId).get().then(s => {
    document.getElementById("statReq").textContent = s.size;
  });
}

// ---------------- INIT ----------------
applyLang();
loadMovies();
</script>
