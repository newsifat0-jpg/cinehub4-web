<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Prime Scene • Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="adminApp">
  <aside class="sidebar">
    <div class="admin-brand"><div class="logo">P</div><div><b>PRIME SCENE</b><small>CONTROL CENTER</small></div></div>
    <div class="admin-user"><div class="avatar">A</div><div><b>Super Admin</b><small>Verified administrator</small></div></div>
    <nav id="sideNav">
      <button data-section="dashboard" class="active">⌂ <span>Dashboard</span></button>
      <button data-section="movies">▣ <span>Movies</span></button>
      <button data-section="users">♙ <span>Users</span></button>
      <button data-section="points">◈ <span>Points & Unlocks</span></button>
      <button data-section="ads">◉ <span>Ads & Rewards</span></button>
      <button data-section="tasks">✓ <span>Daily Tasks</span></button>
      <button data-section="payments">৳ <span>Payments</span><em id="payBadge">3</em></button>
      <button data-section="adult">18+ <span>Adult Library</span></button>
      <button data-section="requests">✉ <span>Movie Requests</span><em>7</em></button>
      <button data-section="broadcast">↗ <span>Broadcast</span></button>
      <button data-section="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="side-bottom"><button id="openUser">↗ Open User App</button><button id="logout">⇥ Sign out</button></div>
  </aside>

  <main class="main">
    <header class="top">
      <button id="mobileMenu" class="hamb">☰</button>
      <div><span class="eyebrow">ADMIN PANEL</span><h1 id="pageTitle">Dashboard</h1></div>
      <div class="top-actions"><span class="live"><i></i> Live</span><button class="icon">⌕</button><button class="avatar small">A</button></div>
    </header>

    <section id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script src="admin.js"></script>
</body>
</html>
