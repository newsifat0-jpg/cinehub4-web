<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>Cine Hub4 • Admin Control Center</title>
  <link rel="stylesheet" href="admin.css?v=20260821icons2">
  <script src="language.js?v=20260821lang2"></script>
</head>
<body>
  <!-- Gate -->
  <div id="adminGate">
    <div class="gate-card">
      <div class="gate-logo">C4</div>
      <h1>Cine Hub4</h1>
      <p>Admin Control Center</p>
      <p class="muted smalltext" id="adminGateStatus" style="margin:10px 0 16px">
        শুধু Script Properties → ADMIN_IDS-এ থাকা Telegram ID দিয়ে ঢোকা যাবে।
      </p>
      <button type="button" id="btnEnterAdmin" class="btn primary" style="width:100%;padding:14px;font-size:15px">
        Enter Admin Panel
      </button>
      <small>Open from Telegram Mini App · Server verifies ADMIN_IDS · Firebase synced</small>
    </div>
  </div>

  <!-- App shell -->
  <div id="adminApp" class="hidden">
    <div id="sideBackdrop" class="side-backdrop hidden"></div>
    <aside class="sidebar">
      <div class="admin-brand">
        <div class="logo">C4</div>
        <div><b>CINE HUB4</b><small>CONTROL CENTER</small></div>
      </div>
      <div class="admin-user">
        <div class="avatar">✓</div>
        <div><b>Super Admin</b><small>Telegram verified</small></div>
      </div>
      <nav id="sideNav">
        <button type="button" data-section="dashboard" class="active"><span class="adm-ico" data-ico="chart"></span> <span>Dashboard</span></button>
        <button type="button" data-section="movies"><span class="adm-ico" data-ico="film"></span> <span>Movies</span></button>
        <button type="button" data-section="categories"><span class="adm-ico" data-ico="grid"></span> <span>Categories</span></button>
        <button type="button" data-section="users"><span class="adm-ico" data-ico="users"></span> <span>Users</span></button>
        <button type="button" data-section="points"><span class="adm-ico" data-ico="coin"></span> <span>Points & Unlocks</span></button>
        <button type="button" data-section="ads"><span class="adm-ico" data-ico="ad"></span> <span>Ads & Ad IDs</span></button>
        <button type="button" data-section="tasks"><span class="adm-ico" data-ico="task"></span> <span>Daily Tasks</span></button>
        <button type="button" data-section="payments"><span class="adm-ico" data-ico="wallet"></span> <span>Payments</span><em id="payBadge" style="display:none">0</em></button>
        <button type="button" data-section="adult"><span class="adm-ico" data-ico="adult"></span> <span>Adult Library</span></button>
        <button type="button" data-section="requests"><span class="adm-ico" data-ico="mail"></span> <span>Movie Requests</span><em id="reqBadge" style="display:none">0</em></button>
        <button type="button" data-section="content"><span class="adm-ico" data-ico="link"></span> <span>Links & Videos</span></button>
        <button type="button" data-section="broadcast"><span class="adm-ico" data-ico="send"></span> <span>Broadcast</span></button>
        <button type="button" data-section="maintenance"><span class="adm-ico" data-ico="lock"></span> <span>Maintenance</span></button>
        <button type="button" data-section="settings"><span class="adm-ico" data-ico="settings"></span> <span>Settings</span></button>
      </nav>
      <div class="side-bottom">
        <button type="button" id="openUser">↗ Open User App</button>
        <button type="button" id="logout">⇥ Sign out</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <button id="mobileMenu" class="hamb" type="button">☰</button>
        <div>
          <span class="eyebrow">CINE HUB4 · ADMIN</span>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-actions">
          <span class="live"><i></i> Live</span>
          <button class="avatar small" type="button" title="Admin">A</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="config.js?v=20260821adminfix"></script>
  <script src="firebase-helper.js?v=20260821final"></script>
  <script src="admin.js?v=20260822taskfix1"></script>
  <script>
    // Hard bind Enter button (survives any earlier onclick loss)
    document.addEventListener("DOMContentLoaded", function(){
      var b = document.getElementById("btnEnterAdmin");
      if(b){
        b.addEventListener("click", function(e){
          e.preventDefault();
          if(typeof window.adminLogin === "function") window.adminLogin();
          else if(typeof adminLogin === "function") adminLogin();
          else alert("adminLogin missing — admin.js load failed");
        });
      }
    });
  </script>
</body>
</html>
